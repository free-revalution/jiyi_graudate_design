server:
  port: 8080

spring:
  application:
    name: zx-smalab-login-service

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/vanx_user_permiss?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always

file:
  upload-dir: ./uploads

jwt:
  secret: zx_smalab_login_service_jwt_secret_key_2024
  expiration: 7200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.example.login: DEBUG
    org.hibernate.SQL: DEBUG
